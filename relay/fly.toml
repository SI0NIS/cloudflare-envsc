# fly.io 部署配置（任选部署平台之一，railway/render 亦可）
# 部署前先在 fly.io 建好 app 并设置 secret：
#   fly secrets set RELAY_TOKEN=<一段强随机串> -a <your-app>
# 注意：RELAY_TOKEN 必须与 Worker 的 MARKS_PROXY_TOKEN secret 完全一致。
app = "marks-relay-YOURNAME"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
