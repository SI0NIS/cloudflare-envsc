name = "envsc"
main = "src/index.js"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]

# 定时触发（Cloudflare Cron Triggers，时区明确为 UTC）
# 北京时间 15:00–20:00 整点 = UTC 07:00–12:00 →  "0 7-12 * * *"
# （2026-10-07 由 13:00–23:00 调整为 15:00–20:00）
# 兜底原因：SCF 12:55 抓 D-1/D-2 标记，平台数据约 13:00 后陆续就绪；
#   15:00 起步留 2h 缓冲，且 20:00 前有 6 次重试机会（NOT_READY / 失败会自动顺延到下一整点）。
[triggers]
crons = ["0 7-12 * * *"]

# 普通环境变量（非敏感）
[vars]
CNEMC_PSID = "654000000031"
MAIL_FROM = "onboarding@resend.dev"
# 敏感/个人凭据一律用 wrangler secret put 配置（不写进本文件）：
#   wrangler secret put BARK_KEY           # Bark 推送 key（api.day.app 的设备 key）
#   wrangler secret put MAIL_TO            # 邮件兜底收件地址（个人邮箱）
#   wrangler secret put CNEMC_COOKIE       # 企业端会话 cookie，取值形如 jointframe.cluster.sessionid=xxx
#   wrangler secret put MARKS_PROXY_URL    # 【可选】仅当边缘直连不到企业端时才配，如 https://marks-relay-xxx.fly.dev
#   wrangler secret put MARKS_PROXY_TOKEN  # 中继鉴权令牌，须与中继的 RELAY_TOKEN 完全一致
#   wrangler secret put RESEND_API_KEY

# KV 去重存储（id 由 `wrangler kv namespace create ENVSC_KV` 生成）
[[kv_namespaces]]
binding = "ENVSC_KV"
id = "2f5ad113e1d24eb6b76ce6a95d3dc804"
