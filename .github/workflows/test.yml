name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        run: npm ci

      - name: 语法检查
        run: |
          node --check src/index.js
          node --check tools/scf-marks-sync/index.js
          node --check tools/local-sync/run_scf_local.cjs
          node --check tools/local-sync/hourly-alarm.cjs
          node --check tools/local-sync/lib/yili-hourly-fallback.cjs
          node --check tools/yili/cli.mjs
          node --check tools/yili/lib/captcha.mjs
          node --check tools/yili/lib/client.mjs
          node --check tools/yili/lib/config.mjs
          node --check tools/yili/lib/errors.mjs
          node --check tools/yili/lib/http.mjs

      - name: 推送文案规则（buildText）
        run: node tools/buildtext-test.mjs

      - name: marks v2 结构化契约
        run: node tools/marksv2-test.mjs

      - name: 标记合并规则
        run: node tools/merge-test.mjs

      - name: 窗口提取/合并算法
        run: node tools/windows-test.mjs

      - name: 小时超标判定
        run: node tools/hourly-alarm-test.mjs

      - name: 伊犁州小时超标兜底
        run: node tools/yili-hourly-fallback-test.mjs

      - name: 看门狗逻辑
        run: node tools/watchdog-test.mjs

      - name: 公开平台故障告警（失败可见 + 幂等）
        run: node tools/pubfail-test.mjs

      - name: 维护期欠推日报自动补推
        run: node tools/backfill-test.mjs

      - name: 伊犁州平台采集适配器
        run: node tools/yili-test.mjs
